<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070A0F"/>
      <stop offset="1" stop-color="#0D141C"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6F1F8"/>
      <stop offset="0.55" stop-color="#85B8D8"/>
      <stop offset="1" stop-color="#3E7CA6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#85B8D8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#85B8D8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#85B8D8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 160) scale(360 220)">
      <stop offset="0" stop-color="#85B8D8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#85B8D8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#85B8D8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <path d="M28 0H1200V292L1172 320H0V28Z"/>
    </clipPath>
    <style>
      .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace}
      .scan{animation:scan 7s cubic-bezier(.6,0,.4,1) infinite}
      @keyframes scan{0%{transform:translateX(-420px)}60%,100%{transform:translateX(1300px)}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .shard{transform-origin:930px 160px;animation:spin 40s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.scan,.blink,.shard,.pulse{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- geometric emblem -->
    <g class="shard" stroke="#85B8D8" fill="none">
      <path d="M930 40L1034 100V220L930 280L826 220V100Z" stroke-opacity="0.35"/>
      <path d="M930 76L1003 118V202L930 244L857 202V118Z" stroke-opacity="0.22"/>
      <path d="M930 40V280M826 100L1034 220M1034 100L826 220" stroke-opacity="0.08"/>
    </g>
    <path d="M930 112L972 136V184L930 208L888 184V136Z" fill="#85B8D8" fill-opacity="0.08" stroke="#85B8D8" stroke-opacity="0.7"/>
    <path d="M930 140L948 150V170L930 180L912 170V150Z" fill="#85B8D8" class="pulse"/>

    <rect class="scan" x="0" y="0" width="420" height="320" fill="url(#scan)"/>
  </g>

  <!-- frame: top-left + bottom-right cut -->
  <path d="M28.5 .5H1199.5V291.8L1171.8 319.5H.5V28.2Z" stroke="#85B8D8" stroke-opacity="0.35"/>
  <path d="M.5 60V28.2L28.5 .5H88" stroke="#85B8D8" stroke-width="2"/>
  <path d="M1199.5 260V291.8L1171.8 319.5H1112" stroke="#85B8D8" stroke-width="2"/>

  <!-- text -->
  <text x="72" y="92" class="mono" font-size="14" letter-spacing="4" fill="#85B8D8">// FULL-STACK &amp; SYSTEMS DEVELOPER</text>
  <text x="68" y="170" class="sans" font-size="76" font-weight="800" letter-spacing="2" fill="url(#brand)">TENZEROO</text>
  <text x="72" y="212" class="sans" font-size="20" fill="#A9BCCB">Web platforms, Discord automation &amp; game tooling.</text>
  <text x="72" y="238" class="sans" font-size="20" fill="#6F8496">Built in Nepal. Shipped for real users.</text>

  <g class="mono" font-size="13" letter-spacing="1.5">
    <rect x="72" y="262" width="8" height="8" fill="#5BD49A" class="pulse"/>
    <text x="90" y="270" fill="#8FA3B3">AVAILABLE FOR FREELANCE</text>
    <text x="318" y="270" fill="#3B4C5A">/</text>
    <text x="338" y="270" fill="#8FA3B3">NEPAL</text>
    <text x="398" y="270" fill="#3B4C5A">/</text>
    <text x="418" y="270" fill="#8FA3B3">UTC+05:45</text>
    <text x="514" y="270" fill="#85B8D8" class="blink">_</text>
  </g>
</svg>
